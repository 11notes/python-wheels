name: update
run-name: update ${{ inputs.wheel }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      wheel:
        description: 'name of wheel to use for build'
        type: string
        required: true

      version:
        description: 'version of wheel to build'
        type: string
        required: true

      python:
        description: 'list of python versions MAJOR.MINOR to build for'
        type: string
        required: false
        default: "3.14,3.13"

      platform:
        description: 'list of platforms to build for'
        type: string
        required: false
        default: "amd64,arm64,arm/v7"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: exists
        run: |
          if ! curl -s "https://11notes.github.io/python-wheels/" | grep -q "https://pub.11notes.dev/python/wheels/alpine/${{ inputs.wheel }}/${{ inputs.version }}/"; then
            echo "EXISTS=false" >> "${GITHUB_ENV}"
            echo "${{ inputs.wheel }}/${{ inputs.version }} does not exist"
          fi

      - name: call / build.yml
        if: env.EXISTS == 'false'
        uses: benc-uk/workflow-dispatch@7a027648b88c2413826b6ddd6c76114894dc5ec4 #v1.3.1 # v4.0.0
        with:
          wait-for-completion: false
          workflow: build.yml
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "wheel":"${{ inputs.wheel }}", "version":"${{ inputs.version }}", "python":"${{ inputs.python }}", "platform":"${{ inputs.platform }}" }'