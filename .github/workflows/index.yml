name: index

on:
  workflow_dispatch:
  schedule:
    - cron: "55 */2 * * *"

jobs:
  # ╔═════════════════════════════════════════════════════╗
  # ║                                                     ║
  # ║                                                     ║
  # ║                    CREATE HTML                      ║
  # ║                                                     ║
  # ║                                                     ║
  # ╚═════════════════════════════════════════════════════╝
  index:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # CHECKOUT REPO
      - name: init / checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # CREATE INDEX
      - name: html / index
        continue-on-error: true
        run: |
          echo "<!DOCTYPE html><html><head><title>11notes/python:wheels</title></head><body><h1>wheels for python on alpine linux</h1>" > ./docs/index.html
          for WHL in ./whl/*; do
            for VERSION in ${WHL}/*; do
              if [ -f "${VERSION}/index.html" ]; then
                cat "${VERSION}/index.html" >> ./docs/index.html
              fi
            done
          done
          echo "</body></html>" >> ./docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./docs/index.html
          git commit -m "chore: update index.html"
          git push

      - name: github / update description and set repo defaults
        run: |
          curl --request PATCH \
            --url https://api.github.com/repos/${{ github.repository }} \
            --header 'authorization: Bearer ${{ secrets.REPOSITORY_TOKEN }}' \
            --header 'content-type: application/json' \
            --data '{
              "homepage":"",
              "has_issues":true,
              "has_discussions":true,
              "has_projects":false,
              "has_wiki":false
            }' \
            --fail