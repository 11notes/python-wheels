name: index

on:
  workflow_dispatch:

jobs:
  # ╔═════════════════════════════════════════════════════╗
  # ║                                                     ║
  # ║                                                     ║
  # ║                    CREATE HTML                      ║
  # ║                                                     ║
  # ║                                                     ║
  # ╚═════════════════════════════════════════════════════╝
  index:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # CHECKOUT REPO
      - name: init / checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # CREATE INDEX
      - name: html / index
        continue-on-error: true
        run: |
          echo "<!DOCTYPE html><html><head><title>11notes/python:wheels</title></head><body><h1>python wheels for alpine linux - last updated $(date)</h1>" > ./docs/index.html
          for WHL in ./whl/*; do
            for VERSION in ${WHL}/*; do
              if [ -f "${VERSION}/index.html" ]; then
                cat "${VERSION}/index.html" >> ./docs/index.html
              fi
            done
          done
          echo "</body></html>" >> ./docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./docs/index.html
          git commit -m "chore: update index.html"
          git push

      # SETUP GITHUB PAGES
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # UPLOAD STATIC CONTENT
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      # DEPLOY PAGE
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4