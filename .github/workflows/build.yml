name: build
run-name: build ${{ inputs.wheel }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'list of platforms to build for'
        type: string
        required: false
        default: "amd64,arm64,arm/v7"

      python:
        description: 'list of python versions MAJOR.MINOR to build for'
        type: string
        required: false
        default: "3.15,3.14,3.13"

      wheel:
        description: 'name of wheel to use for build'
        type: string
        required: true

      version:
        description: 'version of wheel to build'
        type: string
        required: true

jobs:
  # ╔═════════════════════════════════════════════════════╗
  # ║                                                     ║
  # ║                                                     ║
  # ║               CREATE PLATFORM MATRIX                ║
  # ║                                                     ║
  # ║                                                     ║
  # ╚═════════════════════════════════════════════════════╝
  matrix:
    runs-on: ubuntu-latest
    outputs:
      stringify: ${{ steps.setup-matrix.outputs.stringify }}

    steps:
      - name: matrix / setup list
        id: setup-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const platforms = "${{ github.event.inputs.platform }}".split(",");
            const pythons = "${{ github.event.inputs.python }}".split(",");
            const matrix = {include:[]};
            for(const platform of platforms){
              for(const python of pythons){
                switch(platform){
                  case "amd64": matrix.include.push({python:python, platform:platform, runner:"ubuntu-24.04"}); break;
                  case "arm64": matrix.include.push({python:python, platform:platform, runner:"ubuntu-24.04-arm"}); break;
                  case "arm/v7": matrix.include.push({python:python, platform:platform, runner:"ubuntu-24.04-arm"}); break;
                }
              }
            }
            const stringify = JSON.stringify(matrix);
            core.setOutput('stringify', stringify);

  # ╔═════════════════════════════════════════════════════╗
  # ║                                                     ║
  # ║                                                     ║
  # ║                    BUILD WHEEL                      ║
  # ║                                                     ║
  # ║                                                     ║
  # ╚═════════════════════════════════════════════════════╝
  build:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.matrix.outputs.stringify) }}

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      # DOCKER HUB
      - name: docker / login to hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: 11notes
          password: ${{ secrets.DOCKER_TOKEN }}

      # CHECKOUT REPO
      - name: init / checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # SETUP ENVIRONMENT
      - name: init / environment
        run: |
          MATRIX_PLATFORM_SANITIZED=$(echo ${{ matrix.platform }} | sed 's#/##')
          echo "WHEEL_PATH=$(echo "./python/wheels/alpine/${{ github.event.inputs.wheel }}/${{ github.event.inputs.version }}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"
          echo "IMAGE_CACHE=$(echo "11notes/python-wheels:buildcache-${{ github.event.inputs.wheel }}-${{ github.event.inputs.version }}-${MATRIX_PLATFORM_SANITIZED}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      # SETUP QEMU
      - name: init / setup qemu
        if: matrix.platform == 'arm/v7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "linux/arm/v7"
          cache-image: false

      # SETUP BUILDX BUILDER WITH USING LOCAL REGISTRY TO STORE IMAGE
      - name: init / setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # BUILD WHEEL INSIDE CONTAINER
      - name: wheel / build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ github.event.inputs.wheel }}.dockerfile
          platforms: linux/${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.IMAGE_CACHE }}
          cache-to: type=registry,ref=${{ env.IMAGE_CACHE }},mode=max,compression=zstd,force-compression=true
          tags: localhost:5000/11notes/wheel:latest
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            WHEEL_VERSION=${{ github.event.inputs.version }}

      # EXTRACT WHEEL FROM CONTAINER
      - name: wheel / extract
        run: |
          mkdir -p ${{ runner.temp }}/whl
          docker run --rm -v ${{ runner.temp }}/whl:/whl localhost:5000/11notes/wheel:latest

      # SHOW WHEELS
      - name: wheel / show
        run: |
          ls -lah -af ${{ runner.temp }}/whl

      # PUSH WHEELS TO R2
      - name: wheel / upload to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5.0
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: pub-11notes-dev
          source-dir: ${{ runner.temp }}/whl
          destination-dir: ${{ env.WHEEL_PATH }}
          keep-file-fresh: true